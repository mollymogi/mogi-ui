name: Components

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --test scripts/code-block-diff.test.mjs scripts/console-feedback.test.mjs
      - run: pnpm registry:build
      - run: git diff --exit-code -- apps/docs/public/r
